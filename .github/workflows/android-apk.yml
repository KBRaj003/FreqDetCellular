name: FreqDetCellular Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java version
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          java -version 2>&1 | grep -Eq 'version "17([.]|")'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3" buildozer

      - name: Check source project
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository root:"
          pwd
          echo "Tracked project files:"
          git ls-files | head -500

          if [ ! -f main.py ]; then
            echo "ERROR: main.py not found at repository root."
            echo "This workflow expects a Buildozer/Python-for-Android project."
            exit 10
          fi

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 11
          fi

          grep -nE \
            '^(title|package.name|package.domain|source.dir|requirements|android.permissions|p4a.branch)[[:space:]]*=' \
            buildozer.spec || true

      - name: Build APK and retain verbose diagnostics
        shell: bash
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -uo pipefail
          mkdir -p bin build-diagnostics

          set +e
          buildozer -v android debug \
            2>&1 | tee build-diagnostics/buildozer.log
          result=${PIPESTATUS[0]}
          set -e

          echo "$result" > build-diagnostics/build_exit_code.txt

          echo "Searching repository for APK files..."
          find . -type f -name '*.apk' \
            -not -path './.git/*' \
            -not -path './.buildozer/android/platform/build-*/*' \
            -print | tee build-diagnostics/apk-files.txt || true

          if [ "$result" -ne 0 ]; then
            echo "Buildozer failed with exit code $result."
            grep -Ein \
              'error|failed|exception|requires Java|jnius|No matching distribution|Could not find|SDK location' \
              build-diagnostics/buildozer.log | tail -250 || true
            exit "$result"
          fi

          if ! compgen -G 'bin/*.apk' >/dev/null; then
            candidate=$(find . -type f -name '*.apk' \
              -not -path './.git/*' \
              -not -path './bin/*' | head -n 1 || true)

            if [ -n "$candidate" ]; then
              cp "$candidate" bin/
            fi
          fi

          if ! compgen -G 'bin/*.apk' >/dev/null; then
            echo "ERROR: Build command returned success but no APK exists."
            echo "Searching build directories for diagnostics..."
            find .buildozer bin -maxdepth 10 -type f \
              2>/dev/null | sort | tail -500 || true
            exit 20
          fi

          echo "APK files generated:"
          ls -lh bin/*.apk

          sha256sum bin/*.apk \
            | tee build-diagnostics/apk-sha256.txt

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freqdetcellular-apk-and-logs
          path: |
            bin/*.apk
            build-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
